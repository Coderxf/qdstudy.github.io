<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>导航</title>
    <meta name="keywords" content="导航,资源网站,上网导航,网址导航,网站导航,网址大全,好的网站,上网主页" />
    <meta name="description" content="资源导航网站,主要分享一些精品网站和实用软件，汇集全网优质网址，提供简单便捷的上网导航服务。" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="https://nav.777713.xyz/" />
    <meta name="referrer" content="always" />
    <link rel="shortcut icon" type="image/x-icon" href="https://nav.777713.xyz/favicon.ico"/>
    <link rel="stylesheet" href="./css/animate.css" />
    <link rel="stylesheet" href="./css/iconfont.css"/>
    <link rel="stylesheet" href="./lib/pug-ui/css/pug.css" />
    <link rel="stylesheet" href="./css/index.css" />
    <link rel="stylesheet" href="./css/user.css" />
    <script src="./lib/pug-ui/js/jquery-3.1.0.min.js"></script>
    <script src="./lib/pug-ui/js/pug.js"></script>
    <script src="./js/clipboard.min.js"></script>
    <script src="./js/index.js"></script>
    <script src="./js/user.js"></script>
    <style>
      #login{
        background-color: #4853e5;
        background-image: linear-gradient(132deg, #4853e5 31%, #0093e9 71%, #bd52c1 100%);
        padding: 0 15px;
      }
    </style>
  </head>

  <body>
    <nav class="header">
      <div class="pug-container header-wrapper">
        <img class="logo" src="./favicon.ico" />
        <li><span class="yulu"></span></li>
        <div class="nav-user-wraper">
        </div>
      </div>
    </nav>

    <main class="pug-container oh">
      <div class="app-search-wrapper pr">
        <h1 class="app-slogan">连接世界，探索无限</h2>
        <form action="https://www.baidu.com/s" method="get" target="_blank">
          <div class="search-box">
            <input type="text" class="wd" autocomplete="off" name="wd" autofocus="autofocus" placeholder="请输入搜索内容" />
            <button type="submit">搜索</button>
          </div>
        </form>
        <div id="keywords"></div>
      </div>


      <section class="course-area">
        <div class="elevator">
          <div class="item ksd-item sortable" style="top:9px;left:8px;">
            <img src="./images/icon-auth.png" height="70" width="80"/>
          </div>
            <div class="list-box">
                <div class="toc-box"></div>
                <div class="item back-top">↑</div>
            </div>
        </div>

      <div class="app-link-wrapper" style="margin: 30px 0;">
        <!-- 自定义 -->
        <div id="custom_link_box"><div id="loadingBox"></div></div>
        <!-- 站长推荐 -->
        <div id="sys_link_dox"></div>
      </div>
    </main>

    <footer>
    </footer>

  </body>
</html>
